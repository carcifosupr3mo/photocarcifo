# Chi e' bloccato dal sito, e cosa puo' vedere lo stesso.
#
# Le jail del sito (photocarcifo-login, nginx-limit-req, nginx-botsearch,
# photocarcifo-manuale) non scrivono piu' una regola nel firewall: passano
# da qui. Il firewall chiudeva la porta prima ancora che la connessione si
# aprisse, e chi era stato bloccato vedeva solo un errore di rete — giusto
# per un attacco, pessimo per una persona che ha sbagliato una password.
# Adesso la richiesta arriva fino a nginx, che risponde con la pagina di
# blocco. Piu' avanti non va: l'applicazione non la vede mai.
#
# Le jail che NON sono del sito restano com'erano, con il blocco vero nel
# firewall: sshd non ha una pagina da mostrare, e a chi cerca di eseguire
# codice sul server (photocarcifo-scansioni) e' meglio non rispondere
# affatto che spiegargli qualcosa.

# L'elenco degli indirizzi, tenuto aggiornato da fail2ban attraverso
# script/photocarcifo-bloccati-nginx.py.
#
# La stella e' voluta: con un nome di file preciso, un file mancante (primo
# avvio, container ricostruito da un backup) impedirebbe a nginx di
# partire, e il sito sarebbe giu' per tutti per colpa di un elenco vuoto.
# Con la stella, nessun file significa nessun indirizzo bloccato.
#
# geo lavora su $remote_addr, cioe' l'indirizzo del collegamento vero:
# questo sito non sta dietro nessun proxy o CDN e non usa real_ip, quindi
# nessuna intestazione mandata dal client (X-Forwarded-For, X-Real-IP) puo'
# cambiare chi nginx crede di avere davanti. E' anche lo stesso valore che
# finisce nel registro degli accessi, quello che fail2ban legge: le due
# parti guardano per forza la stessa cosa.
geo $pc_ip_bloccato {
    default 0;
    include /etc/nginx/photocarcifo-bloccati.d/*.conf;
}

# Le due cose che un indirizzo bloccato deve poter raggiungere lo stesso.
#
# La pagina di blocco, ovviamente: se fosse bloccata anche lei, il
# reindirizzamento girerebbe su se stesso all'infinito.
#
# E la verifica dei certificati: se un giorno l'indirizzo da cui Let's
# Encrypt controlla il dominio finisse per sbaglio nell'elenco, il
# certificato non si rinnoverebbe piu' e il sito diventerebbe
# irraggiungibile per tutti — un ban di troppo non deve poter arrivare a
# tanto. Solo acme-challenge, non tutto /.well-known/: quel prefisso non
# ha una location propria, quindi finirebbe nell'applicazione, e
# l'esenzione diventerebbe un canale aperto verso di lei proprio per gli
# indirizzi che si volevano fermare. La location che serve quei file dal
# disco sta nella configurazione del sito, accanto alle altre.
#
# Il confronto e' su $uri, non su $request_uri: $uri e' il percorso gia'
# normalizzato e decodificato da nginx, quindi /bloccato scritto come
# //bloccato, /./bloccato o %2fbloccato e' sempre lo stesso $uri, e non
# esiste una scrittura furba che eviti il controllo restando dentro il
# sito.
map $uri $pc_uri_esente {
    default                            0;
    "/bloccato"                        1;
    "~^/\.well-known/acme-challenge/"  1;
}

# Bloccato (1) e non su una pagina esente (0) — l'unico caso in cui si
# ferma la richiesta.
map "$pc_ip_bloccato$pc_uri_esente" $pc_da_fermare {
    default 0;
    "10"    1;
}
