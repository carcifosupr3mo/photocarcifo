# Chi e' bloccato dal sito, e cosa puo' vedere lo stesso.
#
# Le jail del sito (photocarcifo-login, nginx-limit-req, nginx-botsearch,
# photocarcifo-manuale) non scrivono piu' una regola nel firewall: passano
# da qui. Il firewall chiudeva la porta prima ancora che la connessione si
# aprisse, e chi era stato bloccato vedeva solo un errore di rete — giusto
# per un attacco, pessimo per una persona che ha sbagliato una password.
# Adesso la richiesta arriva fino a nginx, che risponde con la pagina di
# blocco. Piu' avanti non va: l'applicazione non la vede mai.
#
# Le jail che NON sono del sito restano com'erano, con il blocco vero nel
# firewall: sshd non ha una pagina da mostrare, e a chi cerca di eseguire
# codice sul server (photocarcifo-scansioni) e' meglio non rispondere
# affatto che spiegargli qualcosa.

# L'elenco degli indirizzi, tenuto aggiornato da fail2ban attraverso
# script/photocarcifo-bloccati-nginx.py.
#
# La stella e' voluta: con un nome di file preciso, un file mancante (primo
# avvio, container ricostruito da un backup) impedirebbe a nginx di
# partire, e il sito sarebbe giu' per tutti per colpa di un elenco vuoto.
# Con la stella, nessun file significa nessun indirizzo bloccato.
#
# geo lavora su $remote_addr, cioe' l'indirizzo del collegamento vero:
# questo sito non sta dietro nessun proxy o CDN e non usa real_ip, quindi
# nessuna intestazione mandata dal client (X-Forwarded-For, X-Real-IP) puo'
# cambiare chi nginx crede di avere davanti. E' anche lo stesso valore che
# finisce nel registro degli accessi, quello che fail2ban legge: le due
# parti guardano per forza la stessa cosa.
geo $pc_ip_bloccato {
    default 0;
    include /etc/nginx/photocarcifo-bloccati.d/*.conf;
}

# Le due cose che un indirizzo bloccato deve poter raggiungere lo stesso.
#
# La pagina di blocco, ovviamente: se fosse bloccata anche lei, il
# reindirizzamento girerebbe su se stesso all'infinito.
#
# E la verifica dei certificati: se un giorno l'indirizzo da cui Let's
# Encrypt controlla il dominio finisse per sbaglio nell'elenco, il
# certificato non si rinnoverebbe piu' e il sito diventerebbe
# irraggiungibile per tutti — un ban di troppo non deve poter arrivare a
# tanto. Solo acme-challenge, non tutto /.well-known/: quel prefisso non
# ha una location propria, quindi finirebbe nell'applicazione, e
# l'esenzione diventerebbe un canale aperto verso di lei proprio per gli
# indirizzi che si volevano fermare. La location che serve quei file dal
# disco sta nella configurazione del sito, accanto alle altre.
#
# Il confronto e' su $uri, non su $request_uri: $uri e' il percorso gia'
# normalizzato e decodificato da nginx, quindi /bloccato scritto come
# //bloccato, /./bloccato o %2fbloccato e' sempre lo stesso $uri, e non
# esiste una scrittura furba che eviti il controllo restando dentro il
# sito.
map $uri $pc_uri_esente {
    default                            0;
    "/bloccato"                        1;
    "~^/\.well-known/acme-challenge/"  1;
}

# Bloccato (1) e non su una pagina esente (0) — l'unico caso in cui si
# ferma la richiesta.
map "$pc_ip_bloccato$pc_uri_esente" $pc_da_fermare {
    default 0;
    "10"    1;
}

# --- Quando un ban con la pagina non basta piu' ---------------------------
#
# Il problema, trovato dalla security review. Da quando un indirizzo
# bloccato riceve 302 invece del 404 che riceveva prima, i filtri che
# leggono i codici di stato non lo vedono piu': photocarcifo-scansioni
# cerca "404|410", nginx-botsearch cerca "404". Cosi' un programma gia'
# bloccato per volume puo' continuare a provare /.env, wp-config, id_rsa
# e compagnia per tutta la durata del ban senza far scattare niente —
# non ottiene niente (il 302 e' un muro), ma nessuno se ne accorge e
# nessuno lo caccia davvero. Prima quel comportamento portava a una
# regola di firewall e a un avviso.
#
# La risposta: un registro che contiene SOLO le richieste fermate, cosi'
# una jail puo' contarle senza dover indovinare quali 302 del sito siano
# blocchi e quali no (ce ne sono di legittimi, verificato nel registro).
#
# QUALI richieste contare, pero', e' la parte delicata: da questo conteggio
# dipende chi finisce nel firewall per ventiquattro ore. Il criterio non e'
# "quello che il browser chiede da solo" ma il suo contrario — si conta
# solo cio' che NON e' un indirizzo vero del sito. Chiedere una pagina che
# esiste, da bloccati, non fa ottenere niente lo stesso (e' sempre un 302):
# non e' un sondaggio, e contarlo farebbe danno in tre casi concreti, tutti
# incontrati o misurati e non immaginati:
#
#   - la pagina di blocco ricaricata. Chi non capisce cosa e' successo
#     preme aggiorna, non sta attaccando. Attenzione a
#     /bloccato-pagina.html: il registro si scrive alla FINE della
#     richiesta, e li' $uri e' gia' la pagina interna messa da error_page.
#     Senza quella riga venticinque ricariche portavano dritte al firewall.
#   - le miniature di un album gia' aperto. Misurato sul registro vero:
#     una pagina di album ne chiede fino a 356 in due minuti. Chi viene
#     bloccato mentre sta sfogliando continua a scorrere e il caricamento
#     pigro le chiede tutte, senza che abbia cliccato niente.
#   - i cuori dei preferiti e i salvataggi. Vanno per XHR (preferiti.js),
#     quindi la pagina NON naviga e la persona non vede nemmeno il blocco:
#     vede i cuori che non prendono, e continua a cliccare. Venti clic in
#     due minuti sono una cliente che sceglie le foto, non un attacco.
#
# E c'e' il caso che da solo vale tutta questa prudenza: un indirizzo
# condiviso. Dietro un CGNAT di un operatore mobile, o al wifi di un bar,
# ci sono decine di persone con lo stesso indirizzo — se una viene
# bloccata lo sono tutte, e venti visite normali diventerebbero un blocco
# nel firewall per tutte. Contando solo gli indirizzi che il sito non ha,
# una visita normale non conta mai, quante che siano.
#
# Le eccezioni sugli asset sono ancorate alla forma del nome e non al solo
# prefisso: /static/.env o /thumb/id_rsa non devono poter passare per
# innocui solo perche' cominciano bene.
map $uri $pc_uri_innocuo {
    default                              0;

    # La pagina di blocco (e la pagina interna che error_page mette al suo
    # posto: e' quella che si vede nel registro).
    "/bloccato"                          1;
    "/bloccato-pagina.html"              1;

    # Quello che il browser chiede da solo per qualunque pagina.
    "/favicon.ico"                       1;
    "/apple-touch-icon.png"              1;
    "/apple-touch-icon-precomposed.png"  1;
    "/robots.txt"                        1;
    "~^/\.well-known/acme-challenge/"    1;

    # Le pagine vere del sito, anche nelle altre lingue (/en/..., /fr/...).
    # Ogni riga e' ancorata alla forma vera dell'indirizzo, non al solo
    # prefisso: con un prefisso nudo, /media/wp-config.php e /sitemap.php
    # passavano per innocui e un sondaggio poteva nascondersi li' dentro
    # contando zero — trovato dalla code review, provato.
    "~^/(?:en|fr|de|es)?/?$"                                           1;
    "~^/(?:(?:en|fr|de|es)/)?n/"                                       1;
    "~^/(?:p|f|fs)/[A-Za-z0-9_-]{8,}"                                  1;
    "~^/(?:(?:en|fr|de|es)/)?(?:radunimoto|contattami|chi-sono)/?$"    1;
    "~^/(?:(?:en|fr|de|es)/)?(?:novita|recensioni|privacy|search)/?$"  1;
    "~^/(?:(?:en|fr|de|es)/)?mie-preferite/?$"                         1;
    "~^/novita\.xml$"                                                  1;
    "~^/sitemap(?:-immagini)?(?:-\d+)?\.xml$"                          1;

    # Le richieste che il sito fa da solo mentre lo si usa: i cuori dei
    # preferiti, la condivisione, il cambio lingua, il salvataggio di una
    # foto o di un archivio.
    "~^/(?:preferiti(?:-nome)?|condividi|lingua)(?:/|$)"               1;
    "~^/(?:download|video)/\d+$"                                       1;
    "~^/zip/(?:select|node/\d+)$"                                      1;

    # Immagini e materiale statico, ancorati alla forma: le miniature vere
    # sono /thumb/{numero}. Con un carattere jolly, /thumb/id_rsa e
    # /static/.env sarebbero passati per innocui.
    "~^/(?:thumb|thumb2x|preview|cover|social)/\d+$"                   1;
    "~^/static/[\w./-]+\.(?:css|js|png|jpe?g|svg|webp|avif|ico|woff2?|webmanifest|txt|json|xml|html)$"  1;
}

map "$pc_ip_bloccato$pc_uri_innocuo" $pc_sondaggio {
    default 0;
    "10"    1;
}
