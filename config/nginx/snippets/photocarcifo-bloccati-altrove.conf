# Chi e' bloccato dal sito non entra nemmeno negli altri siti di questa
# macchina (pannello, meteo).
#
# Perche' serve. Finche' il ban era una regola del firewall, chiudeva le
# porte 80 e 443 e quindi valeva per TUTTI i siti ospitati qui. Da quando
# le jail del sito mostrano la pagina di blocco invece di chiudere la
# porta, il controllo vive dentro un server block, e da solo coprirebbe
# soltanto photocarcifo.ch: un indirizzo bannato a mano — magari per
# sempre, con /banip — continuerebbe ad arrivare al pannello di
# amministrazione. Un ban che vale per la galleria ma non per il pannello
# e' peggio di nessun ban, perche' sembra fatto.
#
# Qui la risposta e' un 403 secco e non la pagina /bloccato: quella parla
# di Photocarcifo e delle sue fotografie, e su un pannello di controllo
# non c'entra niente. Chi e' bloccato non deve nemmeno sapere cosa c'e'
# dietro.
#
# Le variabili ($pc_da_fermare e le due map che la compongono) sono
# definite una volta sola in photocarcifo-bloccati.conf, incluso dalla
# configurazione di photocarcifo: nginx le condivide fra tutti i siti.
# Vuol dire che questo file va incluso DOPO quello, e che se un giorno si
# disattivasse il sito photocarcifo bisognerebbe togliere anche queste
# inclusioni — altrimenti nginx si fermerebbe su una variabile che non
# esiste piu'.
if ($pc_da_fermare) { return 403; }
