# Header di sicurezza, in un posto solo.
#
# Stanno qui e non sparsi nel file del sito per due motivi.
#
# Il primo: prima erano scritti sia qui in nginx sia dentro l'applicazione,
# e arrivavano al browser due volte. Su X-Frame-Options i due valori erano
# perfino in disaccordo (DENY da una parte, SAMEORIGIN dall'altra): il
# browser deve indovinare a chi credere, e gli strumenti di controllo lo
# segnalano come errore di configurazione.
#
# Il secondo, piu' serio: in nginx un add_header dentro una sezione
# *sostituisce* tutti quelli ereditati da sopra, non si aggiunge. Ogni
# sezione che aveva un suo add_header (i file statici, le miniature, gli
# originali, le pagine degli album) perdeva quindi l'intero blocco di
# protezioni. Raccogliendole in un file basta ripetere una riga di include
# dove serve, invece di ricopiare cinque righe e dimenticarsene una.
#
# La Content-Security-Policy non e' qui: la scrive l'applicazione, perche'
# dipende da cosa contengono le sue pagine.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Senza questo annuncio il browser non sa che esiste HTTP/3 e continua
# a usare la connessione classica per sempre.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
