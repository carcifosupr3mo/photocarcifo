# Chi puo' entrare, chi puo' entrare piano, chi non entra.
#
# Il 17/08/2026 il registro degli accessi diceva questo, in un giorno e mezzo:
#   programmi automatici   5.971 richieste   4.982 MB
#   visitatori veri       16.878 richieste       34 MB
# Cioe' 147 volte la banda delle persone. E di quei 4.982 MB, 4.823 stavano
# in TRE richieste sole: il programma di Meta aveva cliccato i collegamenti
# "scarica tutto l'album" e il server gli aveva impacchettato e spedito
# archivi da 2, 1,6 e 1,1 GB.
#
# La regola qui sotto non e' "fuori i robot". I motori di ricerca portano
# le persone e per un fotografo Google Immagini e' il canale principale:
# quelli passano senza limiti. Passano anche i lettori di anteprima delle
# chat, altrimenti i collegamenti incollati su WhatsApp uscirebbero nudi.
# Restano fuori quelli che non portano nessuno: raccoglitori di dati per
# l'intelligenza artificiale e strumenti di analisi commerciale.

# --- I benvenuti: motori di ricerca e anteprime dei messaggi ---------------
map $http_user_agent $automa_utile {
    default 0;
    "~*googlebot|google-inspectiontool|storebot-google"        1;
    "~*bingbot|adidxbot"                                       1;
    "~*applebot|duckduckbot|yandexbot|baiduspider|qwantify"    1;
    # Anteprime dei collegamenti nelle chat e sui social
    "~*facebookexternalhit|whatsapp|twitterbot|telegrambot"    1;
    "~*linkedinbot|slackbot|discordbot|skypeuripreview|pinterest" 1;
}

# --- I non graditi: prendono e non danno ----------------------------------
# Nessuno di questi manda visitatori: o rivendono analisi di posizionamento,
# o raccolgono immagini per addestrare modelli. Le fotografie qui dentro
# sono di Nathan e non c'e' motivo di regalarle a chi non porta nulla.
map $http_user_agent $automa_inutile {
    default 0;
    "~*ahrefsbot|semrushbot|mj12bot|dotbot|blexbot|dataforseo"     1;
    "~*petalbot|amazonbot|bytespider|serpstatbot|seekportbot"      1;
    "~*gptbot|oai-searchbot|chatgpt-user|ccbot|claudebot|claude-web" 1;
    "~*anthropic-ai|meta-externalagent|facebookbot|imagesiftbot"   1;
    "~*omgili|diffbot|magpie-crawler|zoominfobot|scrapy|python-requests" 1;
}

# --- Le reti da cui e' arrivato lo svuotamento ----------------------------
# Il programma di Meta non si dichiara: si presenta come "Chrome su
# Windows", quindi riconoscerlo dal nome non funziona. Lo si riconosce
# dalla rete. Le anteprime dei collegamenti su Facebook e WhatsApp NON
# passano di qui: quelle arrivano da 173.252.x e 69.171.x, verificato nel
# registro. Questo blocco vale solo per gli archivi ZIP e gli scaricamenti,
# non per le pagine: sfogliare il sito puo' continuare a farlo.
geo $rete_senza_scarico {
    default 0;
    57.141.0.0/16 1;
}

# --- La chiave dei limiti -------------------------------------------------
# Chi e' benvenuto ha chiave vuota, e con la chiave vuota nginx non applica
# nessun limite: Google puo' scaricare tutte le miniature che vuole.
map $automa_utile $chiave_limite {
    1       "";
    default $binary_remote_addr;
}
