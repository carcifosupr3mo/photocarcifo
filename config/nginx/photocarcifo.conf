
# Chi arriva da gallery viene mandato all'indirizzo principale, mantenendo
# la pagina richiesta: i collegamenti privati consegnati in passato
# continuano a funzionare.
server {
    listen 443 ssl;
    http2 on;
    server_name gallery.photocarcifo.ch;
    ssl_certificate /etc/letsencrypt/live/photocarcifo.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photocarcifo.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://photocarcifo.ch$request_uri;
}

# Il sito risponde a un solo indirizzo: photocarcifo.ch senza "www".
# Rispondendo anche su www, ogni pagina esisteva in due copie identiche e i
# motori di ricerca dovevano scegliere quale tenere, segnalando tutte le
# altre come duplicati. Con questo spostamento permanente l'indirizzo e' uno
# solo e chi digita www arriva comunque dove voleva.
server {
    listen 443 ssl;
    http2 on;
    server_name www.photocarcifo.ch;
    ssl_certificate /etc/letsencrypt/live/photocarcifo.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photocarcifo.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://photocarcifo.ch$request_uri;
}

limit_req_zone $binary_remote_addr zone=pclogin:10m rate=8r/m;

# Chi supera i limiti riceve "troppe richieste" e non "servizio non
# disponibile": il servizio c'e', e' chi chiede che sta esagerando. La
# differenza non e' formale — 503 dice ai motori di ricerca che il sito e'
# rotto e li fa tornare piu' tardi, 429 dice solo di rallentare.
limit_req_status 429;
limit_conn_status 429;

include snippets/photocarcifo-automi.conf;
include snippets/photocarcifo-bloccati.conf;

# Immagini: un limite largo, tarato su come naviga una persona. Una pagina
# di album ne chiede 120 in un colpo, e chi sfoglia tre album di fila ne
# chiede qualche centinaio: il tetto di dieci al secondo con una raffica di
# 300 non lo sfiora nemmeno. Chi ne chiede diecimila di fila si', e rallenta.
# Una galleria carica 242 miniature in un colpo (121 fotografie in due
# misure). Con seicento al minuto e una scorta di trecento, aprire due
# gallerie di fila esauriva la scorta e le miniature della seconda venivano
# respinte: al visitatore appaiono come immagini rotte, che e' il modo
# peggiore di dire "rallenta". Le miniature stanno in cache e si servono in
# quattro millisecondi: non c'e' motivo di essere avari.
limit_req_zone $chiave_limite zone=pcimg:10m rate=1800r/m;

# Archivi ZIP: sono la cosa piu' costosa che il sito sappia fare. Uno solo
# alla volta per indirizzo, e pochi all'ora. Un cliente che scarica il
# proprio album non se ne accorge; chi ne innesca tre da un giga sequenza
# aspetta.
# Scaricare UNA fotografia e scaricare un ALBUM INTERO erano la stessa
# cosa per questi limiti, e non lo sono per niente.
#
# Misurato il 22/08/2026: il NAS legge a 224 MB/s, il server impacchetta a
# 77 MB/s, la linea di casa spedisce a 600 Mbit/s. Nessuno di questi e' il
# problema. Il problema erano sei richieste al minuto in due, contate
# insieme: chi salvava dieci fotografie una per una finiva la scorta dopo
# quattro e si prendeva un errore, e due persone che scaricavano insieme
# bloccavano la terza.
#
# Una fotografia sono 15 MB che nginx prende dal NAS e spedisce senza far
# lavorare nessuno: puo' essere generosa. Un archivio puo' essere gigabyte
# costruiti in Python: quello resta sorvegliato, ed e' il collegamento che
# nel 2026 ha fatto uscire 4,8 GB in tre richieste.
limit_req_zone $chiave_limite zone=pcfile:10m rate=120r/m;
limit_req_zone $chiave_limite zone=pczip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=pcfileconn:10m;
limit_conn_zone $binary_remote_addr zone=pczipconn:10m;

# Lo stesso indirizzo di una miniatura puo' restituire tre file diversi:
# AVIF ai browser recenti, WebP a quelli di prima, JPEG a chi non dichiara
# nulla. La cache deve tenerli separati.
#
# Questa distinzione c'era gia' scritta ma non veniva usata: la chiave della
# cache era il solo indirizzo, quindi il primo browser che passava decideva
# il formato per tutti gli altri. Finche' i formati erano due il problema
# restava nascosto, perche' il WebP lo leggono ormai tutti; aggiungendo
# l'AVIF sarebbe venuto fuori subito, con riquadri vuoti al posto delle
# fotografie su Safari piu' vecchi.
map $http_accept $formato_immagine {
    default   "jpeg";
    "~*webp"  "webp";
    "~*avif"  "avif";
}
# max_size: il 19/08/2026 la cache stava a 1,8 GB su 2, cioe' aveva gia'
# cominciato a buttare via le immagini piu' vecchie per fare posto alle
# nuove. Ogni sfratto costa caro proprio dove costa di piu': rigenerare
# un'anteprima a schermo intero sono seicentoquarantacinque millisecondi,
# contro dieci se e' gia' pronta. Sul disco ce ne sono 52 di liberi.
proxy_cache_path /var/cache/nginx/photocarcifo levels=1:2 keys_zone=pcache:20m max_size=6g inactive=30d use_temp_path=off;

# Registro a parte per le sole pagine che vanno in errore.
#
# Nel registro normale una pagina rotta e' una riga fra centomila, e nessuno
# la vede: il sito continua a rispondere, quindi il controllo su/giu' resta
# tranquillo, e senza modulo di contatto il visitatore non ha modo di
# segnalarlo. Qui finiscono solo le risposte 5xx, cioe' "colpa del server":
# un file quasi sempre vuoto, che il controllo delle 15 minuti legge in un
# istante e su cui si puo' far scattare un avviso su Telegram.
# Il 503 e' tornato a contare come errore vero. Era stato escluso perche' i
# limiti rispondevano cosi' e facevano scattare l'avviso ogni volta che una
# difesa funzionava; adesso i limiti rispondono 429, che e' un 4xx e non
# entra qui. Un 503 oggi vuol dire davvero qualcosa di rotto — per esempio
# l'archivio sul NAS non piu' scrivibile — e va segnalato.
map $status $errore_server {
    default 0;
    "~^5"   1;
}

server {
    server_name photocarcifo.ch;
    client_max_body_size 0;

    include snippets/photocarcifo-sicurezza.conf;

    # La pagina che vede chi supera i limiti. La serve nginx dal disco:
    # proprio in quel momento l'applicazione e' la cosa da proteggere, e
    # farle disegnare la pagina di errore vorrebbe dire darle comunque il
    # lavoro da cui la stiamo riparando.
    error_page 429 /static/errori/429.html;

    # I file che non esistono sotto /static/ davano la pagina di errore di
    # nginx, con tanto di numero di versione. Ora rispondono con la pagina
    # del sito, tradotta come tutte le altre.
    error_page 404 = @pagina_non_trovata;

    # Chi e' stato bloccato dal sito (vedi snippets/photocarcifo-bloccati.conf)
    # non prosegue oltre questa riga, qualunque cosa abbia chiesto: pagina,
    # album, miniatura, scaricamento, pannello. E' il punto piu' alto in cui
    # si puo' fermare — prima delle location, quindi prima di /static, di
    # /download, di X-Accel-Redirect e dell'applicazione, che non vede mai
    # queste richieste. Il costo e' una ricerca in un albero di indirizzi,
    # niente database e niente Python nemmeno per una miniatura.
    #
    # Un reindirizzamento e non un 403 diretto: chi e' bloccato deve vedere
    # /bloccato nella barra degli indirizzi e capire dove si trova, invece
    # di ricevere una pagina di errore al posto dell'album che si aspettava.
    # La pagina, poi, risponde davvero 403 (vedi location = /bloccato).
    if ($pc_da_fermare) { return 302 /bloccato; }

    # I raccoglitori che non portano visitatori non entrano affatto: e' piu'
    # onesto un "no" secco che farli lavorare a vuoto occupando il server.
    if ($automa_inutile) { return 403; }

    # Vanno ripetuti tutti e due: in nginx un access_log scritto qui
    # sostituisce quello ereditato da sopra invece di aggiungersi, e
    # scrivendo solo il secondo il registro normale degli accessi sparirebbe
    # (con esso fail2ban, che ci legge i tentativi di intrusione).
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/photocarcifo-5xx.log main if=$errore_server;

    # Le sole richieste fermate perche' l'indirizzo e' gia' bloccato, e
    # solo quelle che sono un tentativo vero di prendere qualcosa (vedi
    # $pc_sondaggio: la pagina di blocco, la favicon e robots.txt non
    # contano). Da qui legge la jail photocarcifo-ban-escalation, che
    # dopo un po' di insistenza passa dal blocco con la pagina al blocco
    # vero nel firewall. Un registro a parte e non i 302 del registro
    # normale: di 302 legittimi ce ne sono, e contarli tutti vorrebbe
    # dire cacciare qualcuno per un redirect del sito.
    access_log /var/log/nginx/photocarcifo-bloccati.log main if=$pc_sondaggio;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    location @pagina_non_trovata {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # L'icona del sito ai tre indirizzi dove viene cercata da sola.
    #
    # Il 19/08/2026 nei risultati di Google al posto dell'icona compariva il
    # mappamondo grigio, quello di chi non ne ha una. L'icona c'era e si
    # scaricava senza problemi, ma stava solo dentro /static/, e i motori —
    # prima ancora di leggere le righe della pagina — bussano sempre alla
    # radice: /favicon.ico. Li' rispondeva 404. Lo stesso vale per iPhone e
    # iPad, che cercano apple-touch-icon.png quando si aggiunge il sito alla
    # schermata iniziale.
    #
    # Un "alias" e non una copia: il file resta uno solo, e cambiandolo
    # cambia ovunque.
    # La pagina di chi e' bloccato. Due location invece di una perche'
    # nginx sa servire un file dal disco, oppure rispondere con un codice
    # di errore, ma non le due cose insieme: /bloccato risponde 403 (e'
    # un rifiuto, e i motori di ricerca devono saperlo) e come corpo di
    # quel 403 nginx serve il file, che resta interno e non ha un
    # indirizzo suo raggiungibile da fuori.
    #
    # Nessun collegamento al resto del sito, nessun foglio di stile e
    # nessuna immagine esterni: tutto quello che serve e' dentro il file,
    # perche' qualunque altra richiesta di chi e' bloccato tornerebbe qui.
    # L'unica cosa che la pagina prende da fuori e' il proprio indirizzo
    # IP, che nginx le scrive dentro con una inclusione lato server (ssi):
    # cosi' chi vuole segnalare l'errore sa cosa dire.
    # La verifica dei certificati e' l'unica cosa, oltre alla pagina di
    # blocco, che un indirizzo bloccato puo' ancora raggiungere (vedi
    # $pc_uri_esente): serviti dal disco, non dall'applicazione, cosi'
    # quell'esenzione non diventa una porta di servizio verso di lei.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        access_log off;
    }

    location = /bloccato {
        error_page 403 /bloccato-pagina.html;
        return 403;
    }

    location = /bloccato-pagina.html {
        internal;
        ssi on;
        alias /opt/photocarcifo/config/nginx/bloccato.html;
        include snippets/photocarcifo-sicurezza.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico {
        alias /opt/photocarcifo/app/static/favicon.ico;
        include snippets/photocarcifo-sicurezza.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /apple-touch-icon.png {
        alias /opt/photocarcifo/app/static/icons/icon-180.png;
        include snippets/photocarcifo-sicurezza.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /apple-touch-icon-precomposed.png {
        alias /opt/photocarcifo/app/static/icons/icon-180.png;
        include snippets/photocarcifo-sicurezza.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /static/ {
        alias /opt/photocarcifo/app/static/;
        # Niente "expires": scriverebbe un secondo Cache-Control, e la
        # riga qui sotto dice gia' la stessa cosa piu' "immutable", cioe'
        # "non richiedermelo mai piu' finche' non scade".
        include snippets/photocarcifo-sicurezza.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Non si registrano le richieste andate a buon fine (sono la
        # stragrande maggioranza), ma gli errori del server si', altrimenti
        # una miniatura rotta non lascerebbe traccia da nessuna parte.
        access_log /var/log/nginx/photocarcifo-5xx.log main if=$errore_server;
    }

    location ~ ^/(thumb|thumb2x|preview|cover|social)/ {
        # delay invece di nodelay: chi supera la scorta viene servito
        # piano, non respinto. Una miniatura che arriva tardi si vede
        # comunque; una respinta lascia un buco nella pagina.
        limit_req zone=pcimg burst=600 delay=400;
        proxy_pass http://127.0.0.1:8000;
        proxy_cache pcache;
        proxy_cache_valid 200 30d;
        proxy_cache_bypass $cookie_pc_unlock $cookie_pc_session;
        proxy_no_cache $cookie_pc_unlock $cookie_pc_session;
        proxy_cache_key "$request_uri|$formato_immagine";
        proxy_cache_use_stale error timeout updating;
        include snippets/photocarcifo-sicurezza.conf;
        add_header X-Cache $upstream_cache_status;
        expires 30d;
        # Non si registrano le richieste andate a buon fine (sono la
        # stragrande maggioranza), ma gli errori del server si', altrimenti
        # una miniatura rotta non lascerebbe traccia da nessuna parte.
        access_log /var/log/nginx/photocarcifo-5xx.log main if=$errore_server;
    }

    # Archivi ZIP e scaricamento delle fotografie a piena risoluzione.
    #
    # E' il punto in cui il sito puo' spedire gigabyte con una richiesta
    # sola: il collegamento "scarica tutto l'album" ha prodotto archivi da
    # 2 GB per un programma automatico che lo aveva semplicemente seguito
    # come si segue un collegamento qualsiasi.
    # Una fotografia alla volta. Il file lo tira su nginx dal NAS con
    # X-Accel-Redirect: l'applicazione dice solo quale, poi si fa da parte.
    #
    # burst=40 delay=20: le prime venti partono subito, le venti dopo
    # vengono messe in fila e servite piano invece di essere respinte. Chi
    # salva tutta la sua gara aspetta qualche secondo; prima, dalla quinta
    # in poi, riceveva un errore.
    location ~ ^/download/ {
        if ($rete_senza_scarico) { return 403; }
        limit_req zone=pcfile burst=40 delay=20;
        limit_conn pcfileconn 8;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        # Non entrano in nessun indice: sono file, non pagine.
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/photocarcifo-sicurezza.conf;
    }

    location ~ ^/zip/ {
        if ($rete_senza_scarico) { return 403; }
        limit_req zone=pczip burst=6 delay=2;
        limit_conn pczipconn 3;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        # Non entrano in nessun indice: sono file, non pagine.
        add_header X-Robots-Tag "noindex, nofollow" always;
        include snippets/photocarcifo-sicurezza.conf;
    }

    location /_originals/ {
        internal;
        alias /mnt/magazzino/;
        include snippets/photocarcifo-sicurezza.conf;
        add_header Accept-Ranges bytes;
        # Lo scaricamento di una fotografia comincia in /download/, ma
        # finisce qui: e' questa la risposta che esce davvero, e per nginx
        # le intestazioni scritte qui sostituiscono quelle di la'. Senza
        # questa riga il "non indicizzare" veniva perso proprio sul file,
        # cioe' sull'unica cosa che il programma automatico si porta via.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /p/ {
        limit_req zone=pclogin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/login {
        limit_req zone=pclogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le pagine possono contenere album riservati diversi a seconda di
    # chi le apre: non vanno mai servite dalla cache condivisa.
    location ~ ^/(n|p)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        include snippets/photocarcifo-sicurezza.conf;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # HTTP/3 viaggia su UDP invece che su TCP: su rete mobile, dove i
    # pacchetti si perdono spesso, evita di bloccare tutta la pagina per
    # colpa di un singolo pacchetto mancante. I browser che non lo
    # conoscono restano sull'ascolto classico qui sotto, che non cambia.
    # reuseport va scritto una volta sola per questa porta in tutta la
    # configurazione: sta qui, nel sito principale.
    listen 443 quic reuseport;
    listen 443 ssl;
    http2 on;
    http3 on;
    ssl_certificate /etc/letsencrypt/live/photocarcifo.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/photocarcifo.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}


server {
    # Da http si va dritti all'indirizzo definitivo, senza passare prima
    # dalla versione sicura del vecchio nome: un salto solo invece di due.
    if ($host = gallery.photocarcifo.ch) {
        return 301 https://photocarcifo.ch$request_uri;
    }


    if ($host = www.photocarcifo.ch) {
        return 301 https://photocarcifo.ch$request_uri;
    }


    if ($host = photocarcifo.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    # gallery e' incluso perche' i vecchi collegamenti in giro sul web
    # puntano ancora li': senza, finivano sul contenitore generico e
    # rispondevano "indirizzo non attivo" invece di portare al sito.
    server_name photocarcifo.ch www.photocarcifo.ch gallery.photocarcifo.ch;
    return 404; # managed by Certbot






}