name: Dependabot auto-merge

# Approva e abilita l'auto-merge sulle PR aperte da Dependabot, ma il
# merge vero e proprio avviene solo dopo che il workflow CI (test, lint,
# secret scan) è passato: "auto-merge" in GitHub significa "mergia da
# solo appena i required status checks sono verdi", non "mergia subito".
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Leggi i metadati della PR (pacchetto, versione, tipo di update)
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Abilita l'auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
