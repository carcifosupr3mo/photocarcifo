<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Accesso — {{ site_name() }}</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#0a0c14">
  <link rel="stylesheet" href="{{ asset('/static/css/style.css') }}">
</head>
<body>
<section class="section" style="min-height:100vh; display:flex; align-items:center;">
  <div class="container" style="max-width:460px;">
    <p class="eyebrow">{{ site_name() }}</p>
    <h1 style="font-size:2rem; margin:0.5rem 0 2rem;">Area riservata</h1>

    <form class="form" method="post" action="/admin/login">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="username">Nome utente</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-accent" type="submit">Accedi</button>
    </form>
  </div>
</section>
</body>
</html>
