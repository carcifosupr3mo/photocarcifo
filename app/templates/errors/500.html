{% extends "base.html" %}
{% block title %}{{ t('e500.titolo') }} — {{ site_name() }}{% endblock %}
{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="section" style="text-align:center;padding:clamp(4rem,12vw,8rem) 0;">
  <div class="container">
    <p class="eyebrow" style="color:var(--accent-2);">{{ t('err.codice').format(n=500) }}</p>
    <h1 style="margin:1rem auto 1.5rem;max-width:16ch;">{{ t('e500.titolo') }}</h1>
    <p style="color:var(--ink-soft);max-width:44ch;margin:0 auto 2rem;">
      {{ t('e500.testo') }}</p>
    <a class="btn btn-accent" href="/">{{ t('com.torna') }}</a>
  </div>
</section>
{% endblock %}
