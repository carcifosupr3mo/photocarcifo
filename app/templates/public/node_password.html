{% extends "base.html" %}
{% block title %}{{ t('pwd.titolo') }} — {{ site_name() }}{% endblock %}
{% block head_extra %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<section class="section"><div class="container">
  <p class="eyebrow">{{ t('pwd.eyebrow') }}</p><h1>{{ node.title }}</h1>
  <p style="color:var(--ink-soft);margin:1rem 0 2rem;">{{ t('pwd.invito') }}</p>
  <form class="form" method="post" action="/p/{{ node.access_token }}/unlock" data-invio-unico>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field"><label for="password">{{ t('pwd.campo') }}</label>
      <input type="password" id="password" name="password" required autofocus></div>
    <button class="btn btn-accent" type="submit">{{ t('pwd.btn') }}</button>
  </form>
</div></section>
{% endblock %}
