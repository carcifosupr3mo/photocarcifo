# Filtro della jail photocarcifo-ban-escalation.
#
# Il registro che legge (/var/log/nginx/photocarcifo-bloccati.log) contiene
# GIA' solo richieste fermate perche' l'indirizzo era bloccato, e solo
# quelle che contano come sondaggio: la selezione l'ha fatta nginx con
# $pc_sondaggio (vedi config/nginx/snippets/photocarcifo-bloccati.conf), che
# esclude la pagina di blocco, la favicon, robots.txt e le miniature.
#
# Quindi qui non c'e' niente da distinguere: ogni riga e' un tentativo, e il
# filtro deve solo tirare fuori l'indirizzo. Nessun codice di stato da
# cercare — anzi, e' proprio per non dipendere piu' dai codici di stato che
# questo registro esiste: da quando chi e' bloccato riceve 302 invece di
# 404, i filtri che cercavano "404" non lo vedevano piu'.
# Il formato e' quello del log "main" di nginx: indirizzo, trattino,
# utente, data fra parentesi quadre. Si chiede tutta la testa e non il solo
# indirizzo: oggi in questo file scrive solo $pc_sondaggio, ma legarsi al
# formato costa nulla e impedisce che una riga di altra natura, finita li'
# per una modifica futura, valga come un tentativo.
[Definition]
failregex = ^<HOST> - \S+ \[
ignoreregex =
