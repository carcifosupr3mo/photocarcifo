# Filtro della jail "photocarcifo-manuale" (vedi jail.d/photocarcifo.local):
# alimentata SOLO dal comando /banip del bot Telegram, mai da una scansione
# di log. <HOST> ci deve stare per forza (fail2ban rifiuta un filtro senza
# quel gruppo), ma la lookahead negativa su "niente" prima di <HOST> e'
# sempre vera e quindi il match e' sempre respinto: anche se logpath
# ricevesse per errore delle righe, questa jail non bannerebbe mai nessuno
# da sola.
[Definition]
failregex = ^(?!)<HOST>
ignoreregex =
