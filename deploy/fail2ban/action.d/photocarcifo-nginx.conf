# Ban del sito: non una regola nel firewall, ma la pagina di blocco.
#
# Le jail che usano questa azione non chiudono la porta all'indirizzo:
# lo aggiungono a un elenco che nginx legge, e nginx gli risponde con la
# pagina /bloccato qualunque cosa chieda. Il perche' sta per esteso in
# script/photocarcifo-bloccati-nginx.py; in breve: chi ha sbagliato una
# password non deve vedere un errore di rete, deve vedere scritto che e'
# stato bloccato.
#
# Chi resta padrone dello stato dei ban e' fail2ban: scadenze, persistenza
# fra riavvii, /bloccati, /sblocca, /banip e /unbanip continuano a
# funzionare esattamente come prima, perche' guardano fail2ban e non
# questo elenco. Lo script qui sotto non decide niente, rispecchia.
#
# actionstart svuota gli indirizzi di QUESTA jail invece di ripristinarli:
# quando fail2ban riparte riapplica da solo i ban ancora validi, uno per
# uno (actionban), e quelli scaduti mentre era spento devono sparire.
#
# actioncheck e' il modo in cui fail2ban ripara da solo un'azione andata
# storta: se il controllo fallisce rifa' actionstop + actionstart e
# riprova il ban. Serve proprio qui, perche' una sincronizzazione fallita
# (nginx -t che rifiuta per una modifica di qualcun altro) altrimenti
# resterebbe un buco finche' non capita per caso un altro ban. Il
# controllo e' il piu' economico possibile: c'e' il file che nginx legge?

[Definition]

actioncheck = test -f /etc/nginx/photocarcifo-bloccati.d/bloccati.conf
actionstart = /usr/local/bin/photocarcifo-bloccati-nginx.py avvia <name>
actionstop  = /usr/local/bin/photocarcifo-bloccati-nginx.py ferma <name>
actionflush = /usr/local/bin/photocarcifo-bloccati-nginx.py svuota <name>
actionban   = /usr/local/bin/photocarcifo-bloccati-nginx.py blocca <name> <ip>
actionunban = /usr/local/bin/photocarcifo-bloccati-nginx.py libera <name> <ip>
