# =============================================================
# Photocarcifo - Configurazione Nginx
# Nginx fa da reverse proxy verso FastAPI (uvicorn su 127.0.0.1:8000)
# e serve direttamente le immagini originali dal NAS via X-Accel-Redirect,
# tenendo Python fuori dal trasferimento dei file pesanti.
# =============================================================

# Cache per le miniature generate (leggere, molto richieste)
proxy_cache_path /var/cache/nginx/photocarcifo levels=1:2 keys_zone=thumbs:20m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name 192.0.2.10;

    # Dimensione massima richieste (nessun upload, quindi bassa)
    client_max_body_size 2m;

    # --- File statici (css/js/font) serviti direttamente da Nginx ---
    location /static/ {
        alias /opt/photocarcifo/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Miniature: proxy a FastAPI con cache aggressiva ---
    location /thumb/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache thumbs;
        proxy_cache_valid 200 7d;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Percorso interno protetto: serve gli ORIGINALI dal NAS ---
    # FastAPI autorizza la richiesta e risponde con header
    # X-Accel-Redirect: /_originals/<path>; Nginx invia il file reale.
    location /_originals/ {
        internal;
        alias /mnt/magazzino/;
        # Forza il download con nome originale (impostato da FastAPI via header)
        add_header Content-Disposition $upstream_http_content_disposition;
    }

    # --- Tutto il resto va a FastAPI ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
